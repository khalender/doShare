<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doShare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #201d1d; --canvas: #fdfcfc; --surface-soft: #f8f7f7; --surface-card: #f1eeee;
  --hairline: rgba(15, 0, 0, 0.12); --hairline-strong: #646262;
  --text-body: #424245; --text-mute: #646262;
  --accent: #007aff; --accent-text: #0056b3; --accent-tint: #e8f1ff;
  --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --l1: 2px 2px 0 var(--ink); --l2: 4px 4px 0 var(--ink);
  --inset: inset 3px 3px 0 var(--hairline);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #fdfcfc; --canvas: #1a1717; --surface-soft: #221f1f; --surface-card: #2a2626;
    --hairline: rgba(253, 252, 252, 0.14); --hairline-strong: #9a9898;
    --text-body: #d6d3d3; --text-mute: #a8a5a5;
    --accent-text: #6cb0ff; --accent-tint: #13263d;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 16px/1.5 var(--font-mono); }
.wrap { max-width: 960px; margin: 0 auto; padding: 48px 16px 64px; }
.path { font-size: 14px; color: var(--text-mute); }
h1 { font-size: 38px; margin: 0 0 4px; line-height: 1.3; }
.lead { color: var(--text-body); margin: 0 0 24px; padding-bottom: 24px; border-bottom: 1px solid var(--hairline-strong); }
input[type=search] {
  width: 100%; height: 44px; padding: 0 12px; margin-bottom: 24px;
  font: inherit; color: var(--ink); background: var(--surface-soft);
  border: 1px solid var(--hairline); border-radius: 4px; box-shadow: var(--inset);
}
input[type=search]:focus { outline: 2px solid var(--accent); outline-offset: 2px; background: var(--canvas); border-color: var(--ink); }
h2 { font-size: 16px; margin: 32px 0 8px; }
.list { border: 1px solid var(--ink); box-shadow: var(--l2); background: var(--canvas); }
.row { display: flex; gap: 16px; align-items: baseline; padding: 12px 16px; border-top: 1px solid var(--hairline); text-decoration: none; color: inherit; }
.row:first-child { border-top: 0; }
.row:hover { background: var(--accent-tint); }
.row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.title { font-weight: 500; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.title small { display: block; font-weight: 400; font-size: 14px; color: var(--text-mute); }
.date { font-size: 14px; color: var(--text-mute); white-space: nowrap; }
.arrow { color: var(--accent-text); }
.empty { padding: 24px; border: 1px solid var(--ink); background: var(--surface-soft); box-shadow: var(--inset); color: var(--text-body); }
footer { margin-top: 48px; font-size: 14px; color: var(--text-mute); }
</style>
</head>
<body>
<div class="wrap">
  <div class="path">khalender / doShare</div>
  <h1>doShare</h1>
  <p class="lead" id="count"></p>
  <input type="search" id="q" placeholder="Filter by title or path" aria-label="Filter pages">
  <div id="out"></div>
  <footer>Built from the pages/ folder on every push to main.</footer>
</div>
<script id="pages" type="application/json">__PAGES__</script>
<script>
const pages = JSON.parse(document.getElementById('pages').textContent);
const out = document.getElementById('out');
const q = document.getElementById('q');
document.getElementById('count').textContent =
  pages.length === 1 ? '1 page' : pages.length + ' pages';

function esc(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function draw() {
  const term = q.value.trim().toLowerCase();
  const hits = pages.filter(p => !term || (p.title + ' ' + p.href).toLowerCase().includes(term));
  if (!hits.length) { out.innerHTML = '<div class="empty">[ ] No page matches.</div>'; return; }
  const groups = {};
  for (const p of hits) (groups[p.folder] ||= []).push(p);
  out.innerHTML = Object.keys(groups).sort().map(folder =>
    '<h2>' + esc(folder ? folder + '/' : 'Top level') + '</h2><div class="list">' +
    groups[folder].map(p =>
      '<a class="row" href="' + encodeURI(p.href) + '">' +
      '<span class="title">' + esc(p.title) + '<small>' + esc(p.href) + '</small></span>' +
      '<span class="date">' + esc(p.date) + '</span><span class="arrow">→</span></a>'
    ).join('') + '</div>'
  ).join('');
}
q.addEventListener('input', draw);
draw();
</script>
</body>
</html>
